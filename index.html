<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Love Letter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#fbf3e6;
  --blush:#f8c9d4;
  --pink:#f6b4c3;
  --pink-soft:#fbdde5;
  --coral:#e0605f;
  --coral-dark:#c2465a;
  --gold:#d9962b;
  --blue:#2455ff;
  --font:'Pixelify Sans','Courier New',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font);
  background:var(--cream);
  color:var(--coral-dark);
  overflow:hidden;
  -webkit-font-smoothing:none;
  user-select:none;-webkit-user-select:none;
  touch-action:manipulation;
}
[hidden]{display:none!important}

/* ---------- atmosphere ---------- */
.fx{position:fixed;inset:0;pointer-events:none;z-index:0}
.fx__aurora{
  position:absolute;inset:-10%;
  background:
    radial-gradient(60% 55% at 12% 20%, rgba(246,170,190,.65), transparent 70%),
    radial-gradient(50% 45% at 92% 85%, rgba(255,214,170,.55), transparent 70%),
    radial-gradient(45% 40% at 70% 10%, rgba(255,236,200,.7), transparent 70%),
    radial-gradient(55% 50% at 20% 95%, rgba(236,190,215,.45), transparent 70%);
  animation:aurora 18s ease-in-out infinite alternate;
}
@keyframes aurora{
  from{transform:translate3d(-2%,-1%,0) scale(1)}
  to{transform:translate3d(2%,2%,0) scale(1.06)}
}
.fx__vignette{
  position:absolute;inset:0;
  background:radial-gradient(ellipse at center, transparent 55%, rgba(190,120,130,.22) 100%);
}
.fx__grain{
  position:absolute;inset:0;opacity:.22;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .6  0 0 0 0 .4  0 0 0 0 .4  0 0 0 .5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}

/* ---------- layers ---------- */
.scene{position:fixed;inset:0;z-index:1}
.confetti{position:absolute;inset:0;pointer-events:none;--mx:0;--my:0}
.confetti i{
  position:absolute;display:block;
  translate:calc(var(--mx)*var(--d)*1px) calc(var(--my)*var(--d)*1px);
  animation:drift var(--t) ease-in-out infinite alternate;
  animation-delay:var(--w);
}
.confetti i.h{color:var(--coral);line-height:1;font-style:normal}
.confetti i.o{border-radius:50%;background:rgba(224,96,95,.35)}
.confetti i.s{background:rgba(120,140,255,.55);border-radius:50%}
@keyframes drift{
  from{transform:translate3d(0,0,0) rotate(-8deg)}
  to{transform:translate3d(var(--ax),var(--ay),0) rotate(10deg)}
}
.rain{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.heart{
  position:absolute;top:0;left:0;display:block;pointer-events:none;will-change:transform,opacity;
}
.heart svg{display:block;width:100%;height:100%}
.heart.fall{animation:fall var(--dur) linear var(--delay) both}
.heart.burst{animation:burst var(--dur) cubic-bezier(.2,.7,.3,1) var(--delay) both}
@keyframes fall{
  0%{transform:translate3d(var(--x0),-12vh,0) rotate(var(--r0));opacity:0}
  8%{opacity:var(--o)}
  100%{transform:translate3d(var(--x1),112vh,0) rotate(var(--r1));opacity:var(--o)}
}
@keyframes burst{
  0%{transform:translate3d(var(--x0),var(--y0),0) scale(.2) rotate(0);opacity:0}
  18%{transform:translate3d(var(--x1),var(--y1),0) scale(1) rotate(var(--r0));opacity:var(--o)}
  100%{transform:translate3d(var(--x2),var(--y2),0) scale(.9) rotate(var(--r1));opacity:0}
}

.cursor-dot{
  position:fixed;left:0;top:0;width:12px;height:12px;border-radius:50%;
  border:2px solid rgba(70,110,255,.85);background:rgba(150,180,255,.4);
  pointer-events:none;z-index:50;margin:-6px 0 0 -6px;opacity:0;
  transition:opacity .2s, width .15s, height .15s, margin .15s;
}
.cursor-dot.on{opacity:1}
.cursor-dot.big{width:20px;height:20px;margin:-10px 0 0 -10px}
@media (hover:none){.cursor-dot{display:none}}

/* ---------- stage 1 : cupid ---------- */
.stage{position:absolute;inset:0;outline:none}
.stage--aim{cursor:crosshair}
.target{
  position:absolute;left:50%;top:27%;
  transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:10px;
}
.target__float{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  animation:bob 4.2s ease-in-out infinite;
}
@keyframes bob{
  0%,100%{transform:translateY(-4px) rotate(-1deg)}
  50%{transform:translateY(5px) rotate(1deg)}
}
.envelope{width:136px;height:98px;display:block;filter:drop-shadow(0 6px 10px rgba(224,96,95,.18))}
.target__label{
  font-size:13px;letter-spacing:.3px;color:var(--coral-dark);white-space:nowrap;
  display:flex;gap:7px;align-items:center;
}
.target__label b{color:var(--coral);font-weight:400;font-size:11px}
.target.hit .target__float{animation:none}
.target.hit{animation:vanish .95s ease-in forwards}
@keyframes vanish{
  0%{transform:translate(-50%,-50%) scale(1);filter:blur(0);opacity:1}
  25%{transform:translate(-50%,-50%) scale(1.12);filter:blur(0);opacity:1}
  100%{transform:translate(-50%,-50%) scale(.7);filter:blur(10px);opacity:0}
}
.bow{
  position:absolute;left:50%;bottom:7vh;width:116px;height:64px;margin-left:-58px;
  transform-origin:50% 50%;
  transition:opacity .5s, transform .12s linear;
  pointer-events:none;
}
.bow svg{width:100%;height:100%;overflow:visible;display:block}
.bow .nock{transition:opacity .2s}
.bow.recoil{animation:recoil .25s ease-out}
@keyframes recoil{50%{translate:0 6px}}
.bow.gone{opacity:0;translate:0 24px;transition:opacity .6s,translate .6s}
.arrow-fly{
  position:fixed;left:0;top:0;width:12px;height:60px;pointer-events:none;z-index:6;
  transform-origin:50% 50%;display:none;
}
.arrow-fly svg{width:100%;height:100%;display:block;overflow:visible}
.hint{
  position:absolute;left:0;right:0;bottom:2.4vh;text-align:center;
  font-size:11px;letter-spacing:.4px;color:rgba(194,70,90,.55);
  transition:opacity .4s;padding:0 16px;
}
.hint.fade{opacity:0}

/* ---------- stage 2 : window ---------- */
.stage--ask{display:flex;align-items:center;justify-content:center;pointer-events:none}
.win{
  --z:1;
  pointer-events:auto;
  width:min(310px,86vw);
  background:#fdeaee;
  border:3px solid #e8736f;
  border-radius:7px;
  box-shadow:0 18px 40px rgba(224,96,95,.22),0 2px 0 rgba(255,255,255,.8) inset;
  transform:scale(var(--z));
  transition:transform 1.1s cubic-bezier(.2,.8,.2,1);
  animation:pop .7s cubic-bezier(.2,1.3,.4,1) both;
  position:relative;
}
@keyframes pop{
  from{opacity:0;transform:scale(.55) translateY(24px);filter:blur(6px)}
  to{opacity:1;transform:scale(var(--z)) translateY(0);filter:blur(0)}
}
.win__bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:6px 8px;background:linear-gradient(#f9c7d2,#f4b1c1);
  border-bottom:3px solid #e8736f;
}
.win__title{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--coral-dark)}
.win__ctrls{display:flex;gap:4px}
.win__ctrls i{
  width:14px;height:14px;display:grid;place-items:center;
  background:#fdeaee;border:2px solid #e8736f;border-radius:2px;
  font-style:normal;font-size:9px;line-height:1;color:var(--coral-dark);
}
.win__hearts{
  display:flex;align-items:center;justify-content:center;gap:9px;
  padding:6px 0;background:#fbdbe3;border-bottom:3px solid #e8736f;
  font-size:13px;color:var(--coral);
}
.win__hearts u{width:5px;height:5px;background:#e8a0aa;display:block}
.win__body{
  position:relative;padding:20px 18px 18px;min-height:268px;
  display:flex;flex-direction:column;align-items:center;
  background-color:#f7bccd;
  background-image:
    linear-gradient(90deg,rgba(255,255,255,.34) 50%,transparent 50%),
    linear-gradient(rgba(255,255,255,.34) 50%,transparent 50%);
  background-size:16px 16px;
}
.msg{
  font-size:15px;line-height:1.25;text-align:center;font-weight:500;
  color:var(--coral-dark);min-height:38px;
  text-shadow:0 1px 0 rgba(255,255,255,.35);
}
.cat-wrap{position:relative;margin-top:10px;width:116px;height:102px;animation:catbob 2.4s steps(2) infinite}
@keyframes catbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.cat-wrap svg{width:100%;height:100%;display:block;shape-rendering:crispEdges}
.cat-heart{
  position:absolute;left:50%;top:-20px;margin-left:-8px;width:16px;height:15px;display:block;
  opacity:0;transform:scale(.3);transition:opacity .4s .25s,transform .4s .25s cubic-bezier(.3,1.8,.5,1);
}
.cat-heart svg{display:block;width:100%;height:100%}
.win.yes .cat-heart{opacity:1;transform:scale(1)}
.btns{
  width:100%;margin-top:auto;padding-top:14px;
  display:flex;justify-content:center;gap:14px;align-items:center;min-height:48px;
}
.btn{
  font-family:var(--font);font-size:11px;font-weight:700;letter-spacing:.6px;
  color:var(--coral-dark);background:#fff6f6;
  border:2px solid #e8736f;border-radius:3px;padding:6px 12px;cursor:pointer;
  box-shadow:0 3px 0 #e8736f;
  transition:transform .25s cubic-bezier(.3,1.4,.5,1),left .28s cubic-bezier(.3,1.3,.5,1),top .28s cubic-bezier(.3,1.3,.5,1),background .15s,box-shadow .1s;
}
.btn:hover{background:#fff}
.btn:active{background:#e0605f;color:#fff;transform:translateY(2px) scale(var(--s,1));box-shadow:0 1px 0 #e8736f}
.btn--yes{transform:scale(var(--s,1));z-index:2}
.btn--no{z-index:3}
.btn--no.run{position:absolute}
.after{
  width:100%;margin-top:auto;padding-top:12px;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:7px;
}
.after p{font-size:10.5px;color:var(--coral-dark);letter-spacing:.2px}
.after mark{
  background:var(--blue);color:#fff;padding:1px 4px;font-size:12px;font-weight:700;letter-spacing:.3px;
}
.after .tag{display:flex;gap:7px;align-items:center;font-size:12px}
.after .tag b{color:var(--coral);font-weight:400;font-size:11px}
.win.yes .after{animation:fadeup .6s .5s both}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.win.yes .msg{animation:swap .5s both}
@keyframes swap{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
.win.shake{animation:shake .35s}
@keyframes shake{25%{translate:-3px 0}75%{translate:3px 0}}

@media (prefers-reduced-motion:reduce){
  .fx__aurora,.target__float,.cat-wrap,.confetti i{animation:none!important}
}
</style>
</head>
<body>

<div class="fx" aria-hidden="true">
  <div class="fx__aurora"></div>
  <div class="fx__vignette"></div>
  <div class="fx__grain"></div>
</div>

<!-- hearts rain layer (filled by JS on win) -->
<div class="rain" id="rain" aria-hidden="true"></div>

<main class="scene">
  <!-- ambient confetti layer (parallax depth, filled by JS) -->
  <div class="confetti" id="confetti" aria-hidden="true"></div>

  <!-- STAGE 1: shoot Cupid's arrow at the letter to open it -->
  <section class="stage stage--aim" id="aimStage" tabindex="0" role="application"
           aria-label="Aim and shoot Cupid's arrow at the letter to open it. Press space to shoot.">
    <div class="target" id="target">
      <div class="target__float">
        <svg class="envelope" viewBox="0 0 136 98" aria-hidden="true" shape-rendering="crispEdges">
          <rect x="1.5" y="1.5" width="133" height="95" rx="5" fill="none" stroke="#e0605f" stroke-width="2" stroke-dasharray="3 3"/>
          <rect x="10" y="10" width="116" height="78" fill="#fff6f4" stroke="#e8736f" stroke-width="3"/>
          <polygon points="12,12 124,12 68,56" fill="#f7bccb"/>
          <polyline points="12,86 52,46" fill="none" stroke="#e8a0aa" stroke-width="2"/>
          <polyline points="124,86 84,46" fill="none" stroke="#e8a0aa" stroke-width="2"/>
          <polyline points="12,12 68,56 124,12" fill="none" stroke="#e8736f" stroke-width="2"/>
          <path d="M68 52 l-7 -7 a4.2 4.2 0 0 1 7 -5 a4.2 4.2 0 0 1 7 5 z" fill="#e23b3b"/>
        </svg>
        <p class="target__label"><b>♥</b><span id="label">From Ripkuyy For You</span><b>♥</b></p>
      </div>
    </div>

    <div class="bow" id="bow" aria-hidden="true">
      <svg viewBox="0 0 116 64">
        <path d="M6 14 Q58 78 110 14" fill="none" stroke="#a8691b" stroke-width="8" stroke-linecap="round"/>
        <path d="M6 14 Q58 78 110 14" fill="none" stroke="#e3a640" stroke-width="5" stroke-linecap="round"/>
        <path d="M6 14 L58 42 L110 14" fill="none" stroke="#c98a2c" stroke-width="1.5"/>
        <g class="nock" id="nock">
          <line x1="58" y1="42" x2="58" y2="-14" stroke="#e3a640" stroke-width="3"/>
          <polygon points="58,-26 52,-12 64,-12" fill="#e23b3b"/>
          <polygon points="58,40 53,48 58,45 63,48" fill="#e23b3b"/>
        </g>
      </svg>
    </div>

    <div class="arrow-fly" id="arrowFly" aria-hidden="true">
      <svg viewBox="0 0 12 60">
        <line x1="6" y1="10" x2="6" y2="56" stroke="#e3a640" stroke-width="3"/>
        <polygon points="6,0 0,13 12,13" fill="#e23b3b"/>
        <polygon points="6,54 1,60 6,57 11,60" fill="#e23b3b"/>
      </svg>
    </div>

    <p class="hint" id="hint">aim with your mouse · click or press space to shoot</p>
  </section>

  <!-- STAGE 2: the question -->
  <section class="stage stage--ask" id="askStage" hidden>
    <div class="win" id="win" role="dialog" aria-label="Love">
      <div class="win__bar">
        <span class="win__title">LOVE</span>
        <span class="win__ctrls"><i>_</i><i>▢</i><i>×</i></span>
      </div>
      <div class="win__hearts"><span>♥</span><u></u><span>♥</span><u></u><span>♥</span></div>
      <div class="win__body" id="winBody">
        <p class="msg" id="msg"></p>
        <div class="cat-wrap">
          <span class="cat-heart" id="catHeart" aria-hidden="true"></span>
          <div id="cat"></div>
        </div>
        <div class="btns" id="btns">
          <button class="btn btn--yes" id="yes" type="button">YES</button>
          <button class="btn btn--no" id="no" type="button">NO</button>
        </div>
        <div class="after" id="after" hidden>
          <p id="winSub"></p>
          <div class="tag"><mark id="winTag"></mark><b>♥</b></div>
        </div>
      </div>
    </div>
  </section>
</main>

<div class="cursor-dot" id="cursorDot"></div>

<!-- Backsound Shape of My Heart -->
<audio id="backsound" src="shape-of-my-heart.mp3" loop preload="auto"></audio>

<script>
(() => {
  'use strict';

  /* =====================================================
     EDIT THESE TEXTS
     ===================================================== */
  const CONFIG = {
    sender:   'Ripkuyy',                            // → "From Ripkuyy For You"
    question: 'Do you want to be my girlfriend? ♡',
    yesText:  'YES',
    noText:   'NO',
    winTitle: 'Yayyy! I love you ♡',
    winSub:   "I'm really happy you can accept me",
    winTag:   'I LOVE YOU'
  };
  /* ===================================================== */

  const $ = (id) => document.getElementById(id);
  const aimStage = $('aimStage'), target = $('target'), bow = $('bow'),
        arrowFly = $('arrowFly'), nock = $('nock'), hint = $('hint'),
        askStage = $('askStage'), win = $('win'), winBody = $('winBody'),
        msg = $('msg'), catEl = $('cat'), yes = $('yes'), no = $('no'),
        btns = $('btns'), after = $('after'), rain = $('rain'),
        confetti = $('confetti'), dot = $('cursorDot'),
        backsound = $('backsound');
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = (arr) => arr[(Math.random() * arr.length) | 0];

  function playMusic() {
    if (backsound && backsound.paused) {
      backsound.play().catch(() => {});
    }
  }

  /* ---------- texts ---------- */
  $('label').textContent = `From ${CONFIG.sender} For You`;
  msg.textContent = CONFIG.question;
  yes.textContent = CONFIG.yesText;
  no.textContent = CONFIG.noText;
  $('winSub').textContent = CONFIG.winSub;
  $('winTag').textContent = CONFIG.winTag;

  /* ---------- pixel cat ---------- */
  const PAL = { K:'#17141a', W:'#ffffff', R:'#e23b3b', P:'#f59bb0', B:'#2a2630' };
  const CAT_IDLE = [
    '..KK........KK..',
    '..KKK......KKK..',
    '.KKKKKKKKKKKKKK.',
    '.KKKKKKKKKKKKKK.',
    '.KKWWWKKKKWWWKK.',
    '.KKKWWKKKKKWWKK.',
    '.KKKKKKKPPKKKKK.',
    '.KKKKKKKKKKKKKK.',
    '.KKKKRRKKRRKKKK.',
    '.KKKRRRRRRRRKKK.',
    '.KKKRRRRRRRRKKK.',
    '..KKKRRRRRRKKK..',
    '...KKKKRRKKKK...',
    '....KKKKKKKK....'
  ];
  const CAT_HAPPY = [
    '..KK........KK..',
    '..KKK......KKK..',
    '.KKKKKKKKKKKKKK.',
    '.KKKKKKKKKKKKKK.',
    '.KKWWKKKKKKWWKK.',
    '.KKKWWWKKWWWKKK.',
    '.KKPPKKKPPKKPPK.',
    '.KKKKKKKKKKKKKK.',
    '.KKKKRRKKRRKKKK.',
    '.KKKRRRRRRRRKKK.',
    '.KKKRRRRRRRRKKK.',
    '..KKKRRRRRRKKK..',
    '...KKKKRRKKKK...',
    '....KKKKKKKK....'
  ];
  function catSVG(rows) {
    let r = '';
    rows.forEach((row, y) => {
      for (let x = 0; x < row.length; x++) {
        const c = row[x];
        if (c !== '.') r += `<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${PAL[c]}"/>`;
      }
    });
    return `<svg viewBox="0 0 16 14" aria-hidden="true">${r}</svg>`;
  }
  catEl.innerHTML = catSVG(CAT_IDLE);

  /* ---------- heart shape ---------- */
  const HEART = (c) => `<svg viewBox="0 0 24 22"><path fill="${c}" d="M12 21C3 14.5 0 10 0 6A5.8 5.8 0 0 1 12 4a5.8 5.8 0 0 1 12 2c0 4-3 8.500-12 15z"/></svg>`;

  $('catHeart').innerHTML = HEART('#e23b3b');

  /* ---------- ambient confetti ---------- */
  (function buildConfetti() {
    const n = innerWidth < 600 ? 26 : 46;
    const f = document.createDocumentFragment();
    for (let i = 0; i < n; i++) {
      const el = document.createElement('i');
      const kind = pick(['h','h','o','o','o','s']);
      const d = pick([-14,-8,-4,4,8,14,22]);
      el.className = kind;
      if (kind === 'h') { el.textContent = '♥'; el.style.fontSize = rnd(5, 11) + 'px'; }
      else { const s = kind === 's' ? rnd(3,5) : rnd(2,4.5); el.style.width = el.style.height = s + 'px'; }
      el.style.left = rnd(1, 99) + '%';
      el.style.top = rnd(2, 98) + '%';
      el.style.setProperty('--d', d);
      el.style.setProperty('--ax', rnd(-14, 14) + 'px');
      el.style.setProperty('--ay', rnd(-18, 18) + 'px');
      el.style.setProperty('--t', rnd(4, 9) + 's');
      el.style.setProperty('--w', -rnd(0, 8) + 's');
      f.appendChild(el);
    }
    confetti.appendChild(f);
  })();

  /* ---------- pointer tracking ---------- */
  let px = innerWidth / 2, py = innerHeight * 0.5;
  addEventListener('pointermove', (e) => {
    px = e.clientX; py = e.clientY;
    dot.classList.add('on');
    dot.style.transform = `translate(${px}px,${py}px)`;
    confetti.style.setProperty('--mx', (px / innerWidth - .5) * 2);
    confetti.style.setProperty('--my', (py / innerHeight - .5) * 2);
    if (stage === 1) aimAt(px, py);
  }, { passive: true });
  addEventListener('pointerdown', () => dot.classList.add('big'));
  addEventListener('pointerup', () => dot.classList.remove('big'));
  document.addEventListener('pointerleave', () => dot.classList.remove('on'));

  /* =====================================================
     STAGE 1  —  bow & arrow
     ===================================================== */
  let stage = 1, aim = 0, flying = false, opened = false;
  const MAX = 78 * Math.PI / 180;

  function pivot() {
    const r = bow.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }
  function aimAt(x, y) {
    if (flying || opened) return;
    const p = pivot();
    let a = Math.atan2(x - p.x, -(y - p.y));
    aim = Math.max(-MAX, Math.min(MAX, a));
    bow.style.transform = `rotate(${aim}rad)`;
  }
  function targetRect() {
    const r = target.querySelector('.envelope').getBoundingClientRect();
    const m = 14;
    return { l: r.left - m, r: r.right + m, t: r.top - m, b: r.bottom + m };
  }

  function shoot() {
    if (stage !== 1 || flying || opened) return;
    playMusic();
    flying = true;
    hint.classList.add('fade');
    bow.classList.remove('recoil'); void bow.offsetWidth; bow.classList.add('recoil');
    nock.style.opacity = 0;

    const p = pivot();
    const dx = Math.sin(aim), dy = -Math.cos(aim);
    let x = p.x + dx * 30, y = p.y + dy * 30;
    const speed = 1500; // px / s
    let last = performance.now();
    arrowFly.style.display = 'block';

    const frame = (now) => {
      const dt = Math.min(0.033, (now - last) / 1000); last = now;
      // sub-steps so a fast arrow never tunnels through the letter
      const steps = 4;
      for (let i = 0; i < steps; i++) {
        x += dx * speed * dt / steps;
        y += dy * speed * dt / steps;
        const t = targetRect();
        if (x > t.l && x < t.r && y > t.t && y < t.b) { return hitEnvelope(x, y); }
      }
      place(x, y);
      if (x < -80 || x > innerWidth + 80 || y < -80 || y > innerHeight + 80) {
        return missed();
      }
      requestAnimationFrame(frame);
    };
    place(x, y);
    requestAnimationFrame(frame);

    function place(tx, ty) {
      const cx = tx - dx * 30, cy = ty - dy * 30;
      arrowFly.style.transform = `translate(${cx - 6}px,${cy - 30}px) rotate(${aim}rad)`;
    }
  }

  function missed() {
    arrowFly.style.display = 'none';
    setTimeout(() => {
      flying = false;
      nock.style.opacity = 1;
      hint.classList.remove('fade');
      aimAt(px, py);
    }, 350);
  }

  function hitEnvelope(x, y) {
    opened = true;
    target.classList.add('hit');
    bow.classList.add('gone');
    spawnBurst(x, y, 16, { small: true });
    setTimeout(() => { arrowFly.style.display = 'none'; }, 350);
    setTimeout(startStage2, 1000);
  }

  aimStage.addEventListener('pointerdown', (e) => {
    playMusic();
    if (e.pointerType !== 'mouse') aimAt(e.clientX, e.clientY);
    px = e.clientX; py = e.clientY;
    aimAt(px, py);
    shoot();
  });
  addEventListener('keydown', (e) => {
    if (stage === 1) {
      if (e.code === 'Space' || e.key === 'Enter') { e.preventDefault(); shoot(); }
      if (e.key === 'ArrowLeft')  { aim = Math.max(-MAX, aim - .08); bow.style.transform = `rotate(${aim}rad)`; }
      if (e.key === 'ArrowRight') { aim = Math.min( MAX, aim + .08); bow.style.transform = `rotate(${aim}rad)`; }
    }
  });
  // idle sway until the player moves the pointer
  let swayT = 0, swaying = true;
  addEventListener('pointermove', () => { swaying = false; }, { once: true });
  (function sway() {
    if (stage !== 1) return;
    if (swaying && !flying && !opened) {
      swayT += 0.02;
      aim = Math.sin(swayT) * 0.35;
      bow.style.transform = `rotate(${aim}rad)`;
    }
    requestAnimationFrame(sway);
  })();
  aimStage.focus({ preventScroll: true });

  /* =====================================================
     STAGE 2  —  the question
     ===================================================== */
  function startStage2() {
    stage = 2;
    aimStage.hidden = true;
    askStage.hidden = false;
  }

  let noHits = 0;
  function dodge() {
    if (win.classList.contains('yes')) return;
    noHits++;
    const b = winBody.getBoundingClientRect();
    const scale = parseFloat(getComputedStyle(win).getPropertyValue('--z')) || 1;
    const bw = no.offsetWidth, bh = no.offsetHeight;
    const W = b.width / scale, H = b.height / scale;
    // keep the first dodge anchored where the button already sits
    if (!no.classList.contains('run')) {
      const nb = no.getBoundingClientRect();
      no.style.left = (nb.left - b.left) / scale + 'px';
      no.style.top  = (nb.top  - b.top)  / scale + 'px';
      no.classList.add('run');
      void no.offsetWidth;
    }
    const cx = parseFloat(no.style.left), cy = parseFloat(no.style.top);
    let nx, ny, tries = 0;
    do {
      nx = rnd(8, W - bw - 8);
      ny = rnd(8, H - bh - 8);
      tries++;
    } while (Math.hypot(nx - cx, ny - cy) < 70 && tries < 20);
    no.style.left = nx + 'px';
    no.style.top = ny + 'px';
    // YES grows every time NO runs away
    yes.style.setProperty('--s', Math.min(1 + noHits * 0.14, 1.9));
  }
  ['pointerenter', 'pointerdown', 'focus', 'touchstart'].forEach((ev) =>
    no.addEventListener(ev, (e) => { if (ev === 'touchstart') e.preventDefault(); dodge(); }, { passive: false })
  );
  no.addEventListener('click', (e) => { e.preventDefault(); dodge(); });

  yes.addEventListener('click', () => {
    if (win.classList.contains('yes')) return;
    playMusic();
    win.classList.add('yes');
    msg.textContent = CONFIG.winTitle;
    catEl.innerHTML = catSVG(CAT_HAPPY);
    btns.hidden = true;
    after.hidden = false;

    // zoom the window up so the message can be read
    requestAnimationFrame(() => {
      const w = win.offsetWidth, h = win.offsetHeight;
      const z = Math.min(1.65, (innerWidth * .94) / w, (innerHeight * .9) / h);
      win.style.setProperty('--z', Math.max(1, z).toFixed(3));
    });

    const r = win.getBoundingClientRect();
    spawnBurst(r.left + r.width / 2, r.top + r.height / 2, 46, {});
    rainHearts(60);
    setInterval(() => rainHearts(1, true), 420);
  });

  /* =====================================================
     hearts
     ===================================================== */
  const COLORS = ['#e8505b','#f4788d','#f5a3b8','#d96bb0','#b79bf0','#f6c453','#f59a4b','#ee6a6a'];

  function spawnBurst(x, y, n, opt) {
    const f = document.createDocumentFragment();
    for (let i = 0; i < n; i++) {
      const el = document.createElement('span');
      el.className = 'heart burst';
      const size = opt.small ? rnd(8, 16) : rnd(16, 44);
      const ang = rnd(0, Math.PI * 2), dist = rnd(opt.small ? 40 : 90, opt.small ? 110 : 280);
      el.style.width = size + 'px';
      el.style.height = size * 0.92 + 'px';
      el.style.filter = !opt.small && Math.random() < .55 ? `blur(${rnd(1, 3.2).toFixed(1)}px)` : 'none';
      el.style.setProperty('--x0', x - size / 2 + 'px');
      el.style.setProperty('--y0', y - size / 2 + 'px');
      el.style.setProperty('--x1', x + Math.cos(ang) * dist - size / 2 + 'px');
      el.style.setProperty('--y1', y + Math.sin(ang) * dist - size / 2 + 'px');
      el.style.setProperty('--x2', x + Math.cos(ang) * dist * 1.15 - size / 2 + 'px');
      el.style.setProperty('--y2', y + Math.sin(ang) * dist + (opt.small ? 40 : rnd(120, 360)) + 'px');
      el.style.setProperty('--r0', rnd(-40, 40) + 'deg');
      el.style.setProperty('--r1', rnd(-90, 90) + 'deg');
      el.style.setProperty('--o', rnd(.6, .95).toFixed(2));
      el.style.setProperty('--dur', rnd(opt.small ? .9 : 2.4, opt.small ? 1.4 : 4.2).toFixed(2) + 's');
      el.style.setProperty('--delay', rnd(0, .25).toFixed(2) + 's');
      el.innerHTML = HEART(opt.small ? '#e8505b' : pick(COLORS));
      el.addEventListener('animationend', () => el.remove());
      f.appendChild(el);
    }
    rain.appendChild(f);
  }

  function rainHearts(n, sparse) {
    const f = document.createDocumentFragment();
    for (let i = 0; i < n; i++) {
      const el = document.createElement('span');
      el.className = 'heart fall';
      const size = rnd(sparse ? 8 : 12, sparse ? 22 : 42);
      const x = rnd(-3, 100) * innerWidth / 100;
      el.style.width = size + 'px';
      el.style.height = size * 0.92 + 'px';
      el.style.filter = size > 22 && Math.random() < .6 ? `blur(${rnd(1.2, 3.5).toFixed(1)}px)` : 'none';
      el.style.setProperty('--x0', x + 'px');
      el.style.setProperty('--x1', x + rnd(-120, 120) + 'px');
      el.style.setProperty('--r0', rnd(-30, 30) + 'deg');
      el.style.setProperty('--r1', rnd(-160, 160) + 'deg');
      el.style.setProperty('--o', rnd(.45, .9).toFixed(2));
      el.style.setProperty('--dur', rnd(5, 9.5).toFixed(2) + 's');
      el.style.setProperty('--delay', (sparse ? 0 : rnd(0, 2.2)).toFixed(2) + 's');
      el.innerHTML = HEART(pick(COLORS));
      el.addEventListener('animationend', () => el.remove());
      f.appendChild(el);
    }
    rain.appendChild(f);
  }

  /* keep the bow glued to its pivot on resize */
  addEventListener('resize', () => { if (stage === 1) aimAt(px, py); });
})();
</script>
</body>
</html>
